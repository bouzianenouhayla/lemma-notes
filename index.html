    background-image:linear-gradient(90deg,transparent 22px,var(--margin) 22px,var(--margin) 24px,transparent 24px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px)}

<script>
/* ---------- CONTENT: add a new lemma by adding one object here ---------- */
const CHAPTERS = [
  {id:"evals", title:"Evaluation", blurb:"How we know a model is right, and how we know the judge is right."},
  {id:"agents", title:"Agents & tool use", blurb:"Planning, tool calls, and workflows that act on real systems."},
  {id:"rag", title:"Retrieval", blurb:"Search, reranking, and grounding answers in documents."},
  {id:"foundation", title:"Foundation models", blurb:"Large pretrained models, including models of transactions and tables."},
  {id:"posttraining", title:"Post-training", blurb:"SFT, preference tuning, and the data that shapes behavior."},
  {id:"reliability", title:"Reliability & hallucination", blurb:"Detecting when a model says something it cannot support."}
];

const LEMMAS = [
  {
    id:"llm-as-a-judge", chapter:"evals", num:1,
    title:"LLM judges agree with humans as often as humans do",
    statement:"A strong LLM judge reaches expert-level agreement, but it is biased by position, length and its own style.",
    paper:"Zheng et al., 2023. Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena",
    paperUrl:"https://arxiv.org/abs/2306.05685",
    postUrl:"[LINKEDIN POST URL]",
    date:"2026",
    ink:"the whole series, in one line: a judge is a model too.",
    body:"judge"
  }
];

const ARCHIVE = [];

/* ---------- slides: one array per lemma, in carousel order ---------- */
const DECKS = {
judge: [
`<div class="top"><span><b class="hl" style="font-family:var(--marker);font-size:30px">Lemma</b> Nº 01</span><span>Zheng et al., NeurIPS 2023</span></div>
 <div><h3><span class="hlP">On the Reliability of LLMs as Judges</span></h3>
 <div class="sub">After "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena"</div></div>
 <div class="two">
  <div>
   <div><span class="lbl hl">Definition 1</span> (LLM judge). A model <i>J</i> that, given a question <i>q</i> and answers, returns a verdict. Three modes:<br>
    (a) pairwise: <span class="m">J(q, a, b) ∈ {A, B, tie}</span><br>
    (b) single: <span class="m">J(q, a) ∈ {1,…,10}</span><br>
    (c) reference: <span class="m">J(q, a, a*)</span></div>
   <div><span class="lbl hl">Definition 2</span> (Agreement). How often two judges give the same verdict:
    <div class="mb">Agr(J₁, J₂) = ℙ<sub>x∼𝒟</sub>[ J₁(x) = J₂(x) ]</div></div>
   <div><span class="ink">↳ ties are where it gets messy. Watch them.</span></div>
   <div><span class="lbl hl">Setup.</span> MT-Bench: 80 multi-turn questions, 8 categories. Chatbot Arena: anonymous head-to-head votes from real users.</div>
  </div>
  <div>
   <div class="thm"><span class="lbl hl">Theorem 1</span> (Agreement). <i>A strong LLM judge agrees with experts as often as experts agree with each other:</i><div class="mb" style="border:none">Agr(J, H) ≈ Agr(H, H′)</div></div>
   <div class="thm"><span class="lbl hl">Theorem 2</span> (Bias). <i>LLM judges are biased by answer position, answer length and their own style, and are unreliable graders of math.</i></div>
   <div class="thm"><span class="lbl hl">Theorem 3</span> (Mitigation). <i>Order swapping, few-shot examples and reference answers reduce these failures.</i></div>
   <div class="thm" style="border-color:var(--purple)"><span class="lbl hlP">Corollary</span> (Production). <i>A judge is a model. It must itself be evaluated before its scores are trusted.</i></div>
  </div>
 </div>
 <div class="foot"><span>lemma-notes.com</span><span>Proofs follow → 1/4</span></div>`,

`<div class="top"><span><b class="hl" style="font-family:var(--marker);font-size:30px">Lemma</b> Nº 01</span><span>Zheng et al., NeurIPS 2023</span></div>
 <h4><span class="hlP">Proof of Theorem 1</span> <span style="font-family:var(--hand);font-size:32px;font-weight:400">(Agreement)</span></h4>
 <div class="two">
  <div>
   <div><span class="lbl hl">Step 1.</span> Collect expert human votes on pairwise comparisons between model answers to MT-Bench questions.</div>
   <div><span class="lbl hl">Step 2.</span> Run GPT-4 as a pairwise judge on the same pairs.</div>
   <div><span class="lbl hl">Step 3.</span> Measure agreement: judge vs. human, and human vs. human, excluding ties.</div>
   <div><span class="lbl hl">Remark.</span> Ties are where both humans and models disagree most. Including them lowers every agreement number.</div>
  </div>
  <div>
   <div class="thm" style="text-align:center">
    <div style="font-size:21px">ties excluded</div>
    <div class="m" style="font-size:50px;line-height:1.3">Agr(GPT-4, H) = <span class="hlG">0.85</span></div>
    <div class="m" style="font-size:50px;line-height:1.3">Agr(H, H′) = 0.81</div></div>
   <div>Hence the judge sits at the level of inter-human agreement: it is as consistent with an expert as another expert would be.</div>
   <div><span class="lbl hl">Limit.</span> The claim holds for a <i>strong</i> judge. Weaker models agree far less. <span class="qed" aria-label="end of proof"></span></div>
   <div><span class="ink">↳ "strong judge" does a lot of work here. Test yours.</span></div>
  </div>
 </div>
 <div class="foot"><span>lemma-notes.com</span><span>Proof of Theorem 2 → 2/4</span></div>`,

`<div class="top"><span><b class="hl" style="font-family:var(--marker);font-size:30px">Lemma</b> Nº 01</span><span>Zheng et al., NeurIPS 2023</span></div>
 <h4><span class="hlP">Proof of Theorem 2</span> <span style="font-family:var(--hand);font-size:32px;font-weight:400">(Bias)</span></h4>
 <div class="two">
  <div>
   <div><span class="lbl hl">(i) Position.</span> Ask for a verdict, swap A and B, ask again. A consistent judge keeps its answer:
    <div class="mb">C(J) = ℙ[ J(q,a,b) = σ(J(q,b,a)) ]</div>
    where σ swaps A ↔ B. Measured <span class="m">C(GPT-4) ≈ 0.65</span>; weaker judges do much worse.</div>
   <div><span class="lbl hl">(ii) Verbosity.</span> Pad an answer with repetitive, content-free list items. A fair judge should not prefer it. Weaker judges fall for it in <span class="hlG">&gt;90%</span> of cases; GPT-4 in <span class="hlG">~9%</span>.</div>
  </div>
  <div>
   <div><span class="lbl hl">(iii) Self-preference.</span> Judges show a higher win rate for answers from their own model family. The paper calls this evidence suggestive, not conclusive.</div>
   <div><span class="ink">↳ grade with a different model family.</span></div>
   <div><span class="lbl hl">(iv) Math.</span> Judges mark wrong answers as correct even on problems they can solve themselves when asked directly. Grading ≠ solving.</div>
   <div class="thm"><i>Each bias is measured by a controlled perturbation of the input. The verdict changes when the truth does not.</i> <span class="qed" aria-label="end of proof"></span></div>
  </div>
 </div>
 <div class="foot"><span>lemma-notes.com</span><span>Proof of Theorem 3 → 3/4</span></div>`,

`<div class="top"><span><b class="hl" style="font-family:var(--marker);font-size:30px">Lemma</b> Nº 01</span><span>Zheng et al., NeurIPS 2023</span></div>
 <h4><span class="hlP">Proof of Theorem 3 &amp; Corollary</span></h4>
 <div class="two">
  <div>
   <div><span class="lbl hl">Swap.</span> Judge both orders, keep only consistent verdicts:
    <div class="mb">J*(q,a,b) = J(q,a,b) if consistent, else tie</div>Position bias is removed by construction.</div>
   <div><span class="lbl hl">Few-shot.</span> Showing the judge examples of correct verdicts raises GPT-4's order consistency from <span class="hlG">~65%</span> to <span class="hlG">~78%</span>.</div>
   <div><span class="ink">↳ cheapest fix on this page. Start here.</span></div>
   <div><span class="lbl hl">Reference.</span> Solve first, or give the judge the reference answer. On math, the failure rate drops from <span class="hlG">70%</span> to <span class="hlG">15%</span>. <span class="qed" aria-label="end of proof"></span></div>
  </div>
  <div>
   <div class="thm" style="border-color:var(--purple)"><span class="lbl hlP">Proof of Corollary.</span> <i>By Thm 2, J depends on factors unrelated to quality. By Thm 1, its value is only its measured agreement with humans. Hence</i>
    <div class="mb" style="border:none">trust(J) ⇐ Agr(J, H) on 𝒟<sub>yours</sub></div> <span class="qed" aria-label="end of proof"></span></div>
   <div><span class="lbl hl">In practice.</span> [YOUR PRODUCTION NOTE]</div>
   <div><span class="lbl hl">Look it up.</span><br>
    Zheng et al., 2023 · arXiv:2306.05685<br>
    MT-Bench &amp; Chatbot Arena · lmarena.ai<br>
    lemma-notes.com</div>
  </div>
 </div>
 <div class="foot"><span>lemma-notes.com</span><span>4/4</span></div>`
]
};

/* ---------- rendering ---------- */
const app = document.getElementById('app');
let state = {chapter:'all', q:''};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chIndex = id => CHAPTERS.findIndex(c => c.id === id) + 1;
const label = l => `Lemma ${chIndex(l.chapter)}.${l.num}`;
const isLink = u => /^https?:\/\//.test(u);

function libraryView(){
  const q = state.q.trim().toLowerCase();
  const match = t => !q || t.toLowerCase().includes(q);
  const count = id => LEMMAS.filter(l=>l.chapter===id).length + ARCHIVE.filter(a=>a.chapter===id).length;
  const roman = n => ['I','II','III','IV','V','VI','VII','VIII','IX','X'][n-1] || String(n);
  const toc = `
   <section aria-label="Chapters">
    <div class="shelf">
     ${CHAPTERS.map((c,i)=>`<button type="button" class="spine" data-ch="${c.id}" aria-pressed="${state.chapter===c.id}" title="${esc(c.title)}, ${count(c.id)} so far">
       <span class="band"></span><span class="name">${esc(c.title)}</span><span class="num">${roman(i+1)}</span></button>`).join('')}
    </div>
    <div class="board"></div>
    <div class="shelf-bar">
     <h2>Contents</h2>
     <button type="button" class="allbtn" data-ch="all" aria-pressed="${state.chapter==='all'}">Show every chapter</button>
     <label class="search"><span>Search the notes</span><input id="q" type="search" value="${esc(state.q)}" placeholder="judge, RAG, SFT…"></label>
    </div>
   </section>`;
  const chapters = CHAPTERS.filter(c => state.chapter==='all' || state.chapter===c.id).map((c,i)=>{
    const ls = LEMMAS.filter(l=>l.chapter===c.id && match(l.title+' '+l.statement+' '+l.paper));
    const as = ARCHIVE.filter(a=>a.chapter===c.id && match(a.title+' '+a.note));
    const items = ls.map(l=>`
      <li class="entry">
       <div class="lab"><span class="hl">${label(l)}</span></div>
       <h4><a href="#/lemma/${l.id}">${esc(l.title)}</a></h4>
       <p class="stmt">${esc(l.statement)}</p>
       <div class="meta">${esc(l.paper)}</div>
      </li>`).join('') + as.map(a=>`
      <li class="entry archive">
       <div class="lab">Earlier note</div>
       <h4>${isLink(a.url)?`<a href="${esc(a.url)}">${esc(a.title)}</a>`:esc(a.title)}</h4>
       <div class="meta">${esc(a.note)}${isLink(a.url)?'':' · link to add'}</div>
      </li>`).join('');
    if(!items && q) return '';
    return `<section class="chapter" id="ch-${c.id}">
      <h3><span class="sec">§${chIndex(c.id)}</span>${esc(c.title)}</h3>
      <p class="blurb">${esc(c.blurb)}</p>
      ${items?`<ul class="entries">${items}</ul>`:`<p class="empty">No lemma here yet. The first one on ${esc(c.title.toLowerCase())} is in preparation.</p>`}
    </section>`;
  }).join('') || `<p class="empty">Nothing matches “${esc(state.q)}”. Try a paper name or a topic like evals.</p>`;

  app.innerHTML = `
   <section class="hero">
    <div>
     <h1><span class="hl">Lemma</span></h1>
     <p class="def"><b>lemma</b> (n.), a small result proved on the way to a bigger one.</p>
    </div>
    <div class="hero-side">
     <p>One AI paper at a time, rewritten as math-course notes: definitions, theorems, then the proofs.</p>
     <p>Plus notes in purple from building these systems in production.</p>
     <span class="ink">↳ anything in purple is mine: what I have seen building these systems.</span><br>
     <a class="btn" href="https://www.linkedin.com/in/nbouziane/">Follow the series</a>
    </div>
   </section>
   ${toc}
   <div class="lib"><div id="chapters">${chapters}</div></div>`;

  app.querySelectorAll('[data-ch]').forEach(b=>b.addEventListener('click',()=>{state.chapter = state.chapter===b.dataset.ch ? 'all' : b.dataset.ch;render();}));
  const input = document.getElementById('q');
  input.addEventListener('input',()=>{state.q=input.value;const pos=input.selectionStart;render();const i=document.getElementById('q');i.focus();i.setSelectionRange(pos,pos);});
}

function lemmaView(id){
  const l = LEMMAS.find(x=>x.id===id);
  if(!l){ app.innerHTML = `<section class="reader"><a class="back" href="#/">Back to the library</a><p class="empty">This lemma doesn't exist yet. Pick one from the library.</p></section>`; return; }
  app.innerHTML = `
   <article class="reader">
    <a class="back" href="#/">Back to the library</a>
    <div class="lab" style="font-family:var(--marker);font-weight:700;font-size:30px"><span class="hl">${label(l)}</span> <span style="color:var(--ink-2)">§${chIndex(l.chapter)} ${esc(CHAPTERS.find(c=>c.id===l.chapter).title)}</span></div>
    <h1><span class="hlP">${esc(l.title)}</span></h1>
    <p class="src">After ${esc(l.paper)}</p>
    ${deckHtml(l.body)}
    <div class="links">
     <a href="${esc(l.paperUrl)}">Read the paper</a>
     ${isLink(l.postUrl)?`<a href="${esc(l.postUrl)}">Discuss it on LinkedIn</a>`:''}
    </div>
   </article>`;
  mountDeck();
  window.scrollTo(0,0);
}

/* ---------- deck: scale the drawn page to the column, flip through it ---------- */
function deckHtml(key){
  const slides = DECKS[key];
  if(!slides) return '';
  return `<section class="deck" aria-roledescription="carousel" aria-label="The pages of this lemma">
    <div class="stage" id="stage">${slides.map((h,i)=>`<article class="slide" data-i="${i}" ${i?'hidden':''} aria-label="Page ${i+1} of ${slides.length}">${h}</article>`).join('')}</div>
    <div class="deck-bar">
      <button type="button" id="prev" disabled>← Back</button>
      <button type="button" id="next">Next page →</button>
      <span id="count">1 / ${slides.length}</span>
      <span class="dots" id="dots">${slides.map((_,i)=>`<button type="button" data-go="${i}" aria-current="${i===0}" aria-label="Go to page ${i+1}"><span></span></button>`).join('')}</span>
    </div>
  </section>`;
}

function mountDeck(){
  const stage = document.getElementById('stage');
  if(!stage) return;
  const slides = [...stage.querySelectorAll('.slide')];
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  const count = document.getElementById('count'), dots = document.getElementById('dots');
  let i = 0;

  const fit = () => { const s = stage.clientWidth/1080; slides.forEach(el=>el.style.transform=`scale(${s})`); };
  const show = n => {
    i = Math.max(0, Math.min(slides.length-1, n));
    slides.forEach((el,k)=>el.hidden = k!==i);
    prev.disabled = i===0; next.disabled = i===slides.length-1;
    count.textContent = `${i+1} / ${slides.length}`;
    [...dots.children].forEach((b,k)=>b.setAttribute('aria-current', k===i));
    fit();
  };

  prev.addEventListener('click',()=>show(i-1));
  next.addEventListener('click',()=>show(i+1));
  dots.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b) show(+b.dataset.go);});
  stage.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') show(i+1); if(e.key==='ArrowLeft') show(i-1); });
  let x0=null;
  stage.addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX;},{passive:true});
  stage.addEventListener('touchend',e=>{ if(x0===null) return; const d=e.changedTouches[0].clientX-x0; if(Math.abs(d)>50) show(i+(d<0?1:-1)); x0=null; },{passive:true});
  addEventListener('resize', fit);
  stage.tabIndex = 0;
  show(0);
}

function aboutView(){
  app.innerHTML = `
   <article class="reader" style="max-width:68ch">
    <a class="back" href="#/">Back to the library</a>
    <h1><span class="hlP">About Lemma</span></h1>
    <p>In mathematics, a lemma is a small result you prove so you can use it later. Each Lemma here takes one AI paper and does the same: it states the claim precisely, then shows the evidence behind it.</p>
    <p>The notes in black follow the paper. The notes in <span style="color:var(--purple)">purple</span> are my own comments: what held up, what broke, and what I would do differently, from building RAG systems, agents and evaluation pipelines in fintech.</p>
    <p><span class="ink">↳ so when you see purple, it is me talking, not the paper.</span></p>
    <div class="links"><a href="https://www.linkedin.com/in/nbouziane/">Follow on LinkedIn</a></div>
   </article>`;
}

function render(){
  const h = location.hash.replace(/^#/,'') || '/';
  if(h.startsWith('/lemma/')) lemmaView(h.slice(7));
  else if(h==='/about') aboutView();
  else libraryView();
}
window.addEventListener('hashchange', render);

/* theme toggle */
const tbtn = document.getElementById('theme');
function applyTheme(t){ document.documentElement.dataset.theme = t || 'light'; tbtn.textContent = t==='dark' ? 'Paper' : 'Chalkboard'; }
let saved=null; try{ saved=localStorage.getItem('lemma-theme-2'); }catch(e){}
applyTheme(saved);
tbtn.addEventListener('click',()=>{ const t = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark'; applyTheme(t); try{localStorage.setItem('lemma-theme-2',t);}catch(e){} });

render();
</script>
</body>
</html>
