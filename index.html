<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lemma · AI papers, stated and proved</title>
<meta name="description" content="Lemma: AI research papers rewritten as math-course notes. Definitions, theorems, proofs, and notes from production. By Nouhayla.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f4ec; --paper-2:#fffdf7; --ink:#16161a; --ink-2:#4a4a52; --rule:#c9d6ea; --margin:#e0403a;
  --yellow:rgba(250,255,0,.8); --pink:rgba(255,79,200,.5); --green:rgba(57,255,136,.6); --blue:rgba(77,243,255,.55);
  --purple:#6b2fd1; --line:#16161a;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --hand:'Kalam','Segoe Print','Bradley Hand',cursive;
  --marker:'Caveat','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1f2a26; --paper-2:#26332e; --ink:#eef0e8; --ink-2:#b9c2b8; --rule:#35463f; --margin:#ff7a6e;
    --yellow:rgba(240,230,90,.45); --pink:rgba(255,120,210,.4); --green:rgba(90,240,150,.35); --blue:rgba(100,220,255,.35);
    --purple:#c7a6ff; --line:#eef0e8;
  }
}
:root[data-theme="dark"]{
  --paper:#1f2a26; --paper-2:#26332e; --ink:#eef0e8; --ink-2:#b9c2b8; --rule:#35463f; --margin:#ff7a6e;
  --yellow:rgba(240,230,90,.45); --pink:rgba(255,120,210,.4); --green:rgba(90,240,150,.35); --blue:rgba(100,220,255,.35);
  --purple:#c7a6ff; --line:#eef0e8;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.55;
  background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
  repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px);background-attachment:local}
a{color:inherit}
:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}
.wrap{padding:0 28px 0 76px}
.hl{background:linear-gradient(100deg,transparent 1%,var(--yellow) 3%,var(--yellow) 96%,transparent 99%);padding:0 .15em}
.hlP{background:linear-gradient(100deg,transparent 1%,var(--pink) 3%,var(--pink) 96%,transparent 99%);padding:0 .15em}
.hlG{background:linear-gradient(100deg,transparent 1%,var(--green) 3%,var(--green) 96%,transparent 99%);padding:0 .12em}
.ink{font-family:var(--marker);font-weight:700;color:var(--purple);font-size:1.35em;line-height:1.15;display:inline-block;transform:rotate(-1.2deg)}
.qed{display:inline-block;width:.62em;height:.62em;background:var(--green);border:2px solid var(--line);vertical-align:-.02em;margin-left:.15em}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 8px}
.brand{font-family:var(--serif);font-style:italic;font-size:30px;text-decoration:none}
.bar nav{display:flex;gap:20px;align-items:center;font-family:var(--hand);font-size:17px}
.bar nav a{text-decoration:none;border-bottom:2px solid transparent}
.bar nav a:hover{border-color:var(--ink)}
.theme{font:inherit;background:none;border:2px solid var(--line);color:var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:6px 12px;min-height:44px;cursor:pointer}

/* hero */
.hero{padding:48px 0 36px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:end}
.hero h1{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(72px,11vw,132px);line-height:.9;letter-spacing:-.02em}
.def{font-size:22px;max-width:34ch}
.def b{font-style:italic;font-weight:500}
.hero .ink{margin-top:14px}
.hero-side{font-family:var(--hand);font-size:18px;border:2.5px solid var(--line);background:var(--paper-2);padding:18px 22px;border-radius:15px 255px 15px 225px/225px 15px 255px 15px;transform:rotate(.6deg)}
.hero-side p{margin:0 0 8px}
.hero-side a.btn{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-family:var(--marker);font-weight:700;font-size:26px;text-decoration:none}

/* library */
.lib{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;padding:24px 0 72px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 18px);align-self:start;font-family:var(--hand)}
.toc h2{font-family:var(--marker);font-size:34px;margin:0 0 6px}
.toc ol{list-style:none;margin:0;padding:0}
.toc button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 6px;min-height:44px;box-sizing:border-box;font-size:18px}
.toc button[aria-pressed="true"]{background:linear-gradient(100deg,transparent 1%,var(--yellow) 3%,var(--yellow) 96%,transparent 99%)}
.toc button:focus-visible{outline:3px dashed var(--purple)}
.toc .n{color:var(--ink-2)}
.search{display:block;margin-top:18px}
.search span{display:block;font-size:16px;color:var(--ink-2)}
.search input{width:100%;font:inherit;font-family:var(--hand);font-size:18px;background:var(--paper-2);color:var(--ink);border:2px solid var(--line);padding:8px 10px;min-height:44px;border-radius:12px 225px 12px 255px/255px 12px 225px 12px}

.chapter{margin:0 0 56px}
.chapter h3{margin:0 0 4px;font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.15}
.chapter h3 .sec{font-style:italic;color:var(--ink-2);margin-right:.35em}
.chapter .blurb{margin:0 0 20px;color:var(--ink-2);font-style:italic}
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.entry{border:2.5px solid var(--line);background:var(--paper-2);padding:18px 22px 16px;border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.entry:nth-child(even){border-radius:14px 225px 14px 255px/225px 14px 255px 14px}
.entry .lab{font-family:var(--marker);font-weight:700;font-size:28px}
.entry h4{margin:2px 0 6px;font-weight:500;font-size:24px;line-height:1.3}
.entry h4 a{text-decoration:none}
.entry h4 a:hover{text-decoration:underline;text-decoration-thickness:2px}
.entry .stmt{font-style:italic;margin:0 0 8px}
.entry .meta{font-family:var(--hand);font-size:16px;color:var(--ink-2)}
.entry.archive{border-style:dashed}
.empty{font-family:var(--hand);color:var(--ink-2);border:2px dashed var(--rule);padding:14px 18px}

/* reader */
.reader{padding:24px 0 90px}
.back{font-family:var(--hand);font-size:18px;display:inline-flex;min-height:44px;align-items:center}
.reader h1{font-family:var(--marker);font-weight:700;font-size:clamp(48px,7vw,78px);line-height:1;margin:10px 0 6px}
.reader .src{font-style:italic;color:var(--ink-2);margin:0 0 28px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.cols>div{display:flex;flex-direction:column;gap:18px}
.cols>div+div{border-left:1px solid var(--rule);padding-left:36px}
.lbl{font-family:var(--marker);font-weight:700;font-size:28px}
.thm{border:2.5px solid var(--line);padding:12px 18px;background:var(--paper-2);border-radius:255px 12px 225px 12px/12px 225px 12px 255px}
.m{font-style:italic;white-space:nowrap}
.mb{font-style:italic;font-size:22px;text-align:center;padding:6px 0;border-top:1.5px dashed var(--ink-2);border-bottom:1.5px dashed var(--ink-2);overflow-x:auto}
.reader h2{font-family:var(--marker);font-size:44px;margin:48px 0 14px}
.links{display:flex;flex-wrap:wrap;gap:18px;margin-top:36px;font-family:var(--hand);font-size:18px}
.links a{display:inline-flex;align-items:center;min-height:44px;border:2px solid var(--line);padding:4px 16px;text-decoration:none;border-radius:15px 255px 15px 225px/225px 15px 255px 15px}

footer{font-family:var(--hand);color:var(--ink-2);padding:24px 0 40px;border-top:1.5px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

@media (max-width:820px){
  body{background-image:linear-gradient(90deg,transparent 22px,var(--margin) 22px,var(--margin) 24px,transparent 24px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px)}
  .wrap{padding:0 18px 0 40px}
  .hero,.lib,.cols{grid-template-columns:1fr}
  .toc{position:static}
  .cols>div+div{border-left:none;padding-left:0}
  .bar nav{gap:12px}
}
@media (prefers-reduced-motion:no-preference){
  .hero h1 .hl{background-size:0% 100%;background-repeat:no-repeat;animation:swipe .9s .2s ease-out forwards}
  @keyframes swipe{to{background-size:100% 100%}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="#/" aria-label="Lemma home">Lemma <span class="qed" aria-hidden="true"></span></a>
    <nav>
      <a href="#/">Library</a>
      <a href="#/about">About</a>
      <a href="[YOUR LINKEDIN URL]">Follow on LinkedIn</a>
      <button class="theme" id="theme" type="button" aria-label="Switch light or chalkboard mode">Chalkboard</button>
    </nav>
  </header>
  <main id="app"></main>
  <footer>
    <span>Lemma, notes by Nouhayla, AI/ML engineer in Paris</span>
    <span>lemma-notes.com</span>
  </footer>
</div>

<script>
/* ---------- CONTENT: add a new lemma by adding one object here ---------- */
const CHAPTERS = [
  {id:"evals", title:"Evaluation", blurb:"How we know a model is right, and how we know the judge is right."},
  {id:"agents", title:"Agents & tool use", blurb:"Planning, tool calls, and workflows that act on real systems."},
  {id:"rag", title:"Retrieval", blurb:"Search, reranking, and grounding answers in documents."},
  {id:"foundation", title:"Foundation models", blurb:"Large pretrained models, including models of transactions and tables."},
  {id:"posttraining", title:"Post-training", blurb:"SFT, preference tuning, and the data that shapes behavior."},
  {id:"reliability", title:"Reliability & hallucination", blurb:"Detecting when a model says something it cannot support."}
];

const LEMMAS = [
  {
    id:"llm-as-a-judge", chapter:"evals", num:1,
    title:"LLM judges agree with humans as often as humans do",
    statement:"A strong LLM judge reaches expert-level agreement, but it is biased by position, length and its own style.",
    paper:"Zheng et al., 2023. Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena",
    paperUrl:"https://arxiv.org/abs/2306.05685",
    postUrl:"[LINKEDIN POST URL]",
    date:"2026",
    ink:"the whole series, in one line: a judge is a model too.",
    body:"judge"
  }
];

const ARCHIVE = [];

/* ---------- reader bodies ---------- */
const BODIES = {
judge: `
<div class="cols">
 <div>
  <div><span class="lbl hl">Definition 1</span> (LLM judge). A model <i>J</i> that returns a verdict on answers to a question <i>q</i>:
   <div class="mb">J(q, a, b) ∈ {A, B, tie}</div>
   in pairwise mode, <span class="m">J(q, a) ∈ {1,…,10}</span> for single-answer grading, and <span class="m">J(q, a, a*)</span> when a reference answer is given.</div>
  <div><span class="lbl hl">Definition 2</span> (Agreement).
   <div class="mb">Agr(J₁, J₂) = ℙ<sub>x∼𝒟</sub>[ J₁(x) = J₂(x) ]</div></div>
  <div><span class="ink">↳ ties are where it gets messy. Watch them.</span></div>
 </div>
 <div>
  <div class="thm"><span class="lbl hl">Theorem 1</span> (Agreement). <i>A strong judge agrees with experts as often as experts agree with each other:</i> <div class="mb" style="border:none">Agr(J, H) ≈ Agr(H, H′)</div></div>
  <div class="thm"><span class="lbl hl">Theorem 2</span> (Bias). <i>Judges are biased by answer position, length and their own style, and grade math poorly.</i></div>
  <div class="thm"><span class="lbl hl">Theorem 3</span> (Mitigation). <i>Order swapping, few-shot examples and reference answers reduce these failures.</i></div>
 </div>
</div>
<h2><span class="hlP">Proofs, in short</span></h2>
<div class="cols">
 <div>
  <div><span class="lbl hl">Thm 1.</span> On MT-Bench pairs with expert votes, ties excluded, GPT-4 agrees with humans at <span class="m hlG">0.85</span> versus <span class="m">0.81</span> between humans. <span class="qed" aria-label="end of proof"></span></div>
  <div><span class="ink">↳ "strong judge" does a lot of work here. Test yours.</span></div>
  <div><span class="lbl hl">Thm 2.</span> Perturb the input without changing its quality: swap the order, pad the answer, change the author model. The verdict moves when the truth does not.
   <div class="mb">C(J) = ℙ[ J(q,a,b) = σ(J(q,b,a)) ] ≈ 0.65 for GPT-4</div><span class="qed" aria-label="end of proof"></span></div>
 </div>
 <div>
  <div><span class="lbl hl">Thm 3.</span> Keep only verdicts that survive the swap, show a few solved examples, and give a reference answer on math. <span class="qed" aria-label="end of proof"></span></div>
  <div><span class="ink">↳ few-shot is the cheapest fix. Start there.</span></div>
  <div class="thm"><span class="lbl hlP">Corollary.</span> <i>A judge is a model. It must be evaluated before its scores are trusted:</i> <div class="mb" style="border:none">trust(J) ⇐ Agr(J, H) on 𝒟<sub>yours</sub></div></div>
 </div>
</div>`
};

/* ---------- rendering ---------- */
const app = document.getElementById('app');
let state = {chapter:'all', q:''};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chIndex = id => CHAPTERS.findIndex(c => c.id === id) + 1;
const label = l => `Lemma ${chIndex(l.chapter)}.${l.num}`;
const isLink = u => /^https?:\/\//.test(u);

function libraryView(){
  const q = state.q.trim().toLowerCase();
  const match = t => !q || t.toLowerCase().includes(q);
  const count = id => LEMMAS.filter(l=>l.chapter===id).length + ARCHIVE.filter(a=>a.chapter===id).length;
  const toc = `
   <aside class="toc" aria-label="Chapters">
    <h2>Contents</h2>
    <ol>
     <li><button type="button" data-ch="all" aria-pressed="${state.chapter==='all'}"><span>All chapters</span><span class="n">${LEMMAS.length+ARCHIVE.length}</span></button></li>
     ${CHAPTERS.map((c,i)=>`<li><button type="button" data-ch="${c.id}" aria-pressed="${state.chapter===c.id}"><span>§${i+1} ${esc(c.title)}</span><span class="n">${count(c.id)}</span></button></li>`).join('')}
    </ol>
    <label class="search"><span>Search the notes</span><input id="q" type="search" value="${esc(state.q)}" placeholder="judge, RAG, SFT…"></label>
   </aside>`;
  const chapters = CHAPTERS.filter(c => state.chapter==='all' || state.chapter===c.id).map((c,i)=>{
    const ls = LEMMAS.filter(l=>l.chapter===c.id && match(l.title+' '+l.statement+' '+l.paper));
    const as = ARCHIVE.filter(a=>a.chapter===c.id && match(a.title+' '+a.note));
    const items = ls.map(l=>`
      <li class="entry">
       <div class="lab"><span class="hl">${label(l)}</span></div>
       <h4><a href="#/lemma/${l.id}">${esc(l.title)}</a></h4>
       <p class="stmt">${esc(l.statement)}</p>
       <div class="meta">${esc(l.paper)}</div>
      </li>`).join('') + as.map(a=>`
      <li class="entry archive">
       <div class="lab">Earlier note</div>
       <h4>${isLink(a.url)?`<a href="${esc(a.url)}">${esc(a.title)}</a>`:esc(a.title)}</h4>
       <div class="meta">${esc(a.note)}${isLink(a.url)?'':' · link to add'}</div>
      </li>`).join('');
    if(!items && q) return '';
    return `<section class="chapter" id="ch-${c.id}">
      <h3><span class="sec">§${chIndex(c.id)}</span>${esc(c.title)}</h3>
      <p class="blurb">${esc(c.blurb)}</p>
      ${items?`<ul class="entries">${items}</ul>`:`<p class="empty">No lemma here yet. The first one on ${esc(c.title.toLowerCase())} is in preparation.</p>`}
    </section>`;
  }).join('') || `<p class="empty">Nothing matches “${esc(state.q)}”. Try a paper name or a topic like evals.</p>`;

  app.innerHTML = `
   <section class="hero">
    <div>
     <h1><span class="hl">Lemma</span></h1>
     <p class="def"><b>lemma</b> (n.), a small result proved on the way to a bigger one.</p>
    </div>
    <div class="hero-side">
     <p>One AI paper at a time, rewritten as math-course notes: definitions, theorems, then the proofs.</p>
     <p>Plus notes in purple from building these systems in production.</p>
     <span class="ink">↳ the bigger theorem: the verifier is the moat.</span><br>
     <a class="btn" href="[YOUR LINKEDIN URL]">Follow the series</a>
    </div>
   </section>
   <div class="lib">${toc}<div id="chapters">${chapters}</div></div>`;

  app.querySelectorAll('.toc button').forEach(b=>b.addEventListener('click',()=>{state.chapter=b.dataset.ch;render();}));
  const input = document.getElementById('q');
  input.addEventListener('input',()=>{state.q=input.value;const pos=input.selectionStart;render();const i=document.getElementById('q');i.focus();i.setSelectionRange(pos,pos);});
}

function lemmaView(id){
  const l = LEMMAS.find(x=>x.id===id);
  if(!l){ app.innerHTML = `<section class="reader"><a class="back" href="#/">Back to the library</a><p class="empty">This lemma doesn't exist yet. Pick one from the library.</p></section>`; return; }
  app.innerHTML = `
   <article class="reader">
    <a class="back" href="#/">Back to the library</a>
    <div class="lab" style="font-family:var(--marker);font-weight:700;font-size:30px"><span class="hl">${label(l)}</span> <span style="color:var(--ink-2)">§${chIndex(l.chapter)} ${esc(CHAPTERS.find(c=>c.id===l.chapter).title)}</span></div>
    <h1><span class="hlP">${esc(l.title)}</span></h1>
    <p class="src">After ${esc(l.paper)}</p>
    ${BODIES[l.body]||''}
    <div class="links">
     <a href="${esc(l.paperUrl)}">Read the paper</a>
     ${isLink(l.postUrl)?`<a href="${esc(l.postUrl)}">See the carousel on LinkedIn</a>`:''}
    </div>
   </article>`;
  window.scrollTo(0,0);
}

function aboutView(){
  app.innerHTML = `
   <article class="reader" style="max-width:68ch">
    <a class="back" href="#/">Back to the library</a>
    <h1><span class="hlP">About Lemma</span></h1>
    <p>In mathematics, a lemma is a small result you prove so you can use it later. Each Lemma here takes one AI paper and does the same: it states the claim precisely, then shows the evidence behind it.</p>
    <p>The notes in black follow the paper. The notes in <span style="color:var(--purple)">purple</span> are mine, from building RAG systems, agents and evaluation pipelines in fintech.</p>
    <p><span class="ink">↳ the bigger theorem these lemmas build toward: the verifier is the moat.</span></p>
    <div class="links"><a href="[YOUR LINKEDIN URL]">Follow on LinkedIn</a></div>
   </article>`;
}

function render(){
  const h = location.hash.replace(/^#/,'') || '/';
  if(h.startsWith('/lemma/')) lemmaView(h.slice(7));
  else if(h==='/about') aboutView();
  else libraryView();
}
window.addEventListener('hashchange', render);

/* theme toggle */
const tbtn = document.getElementById('theme');
function applyTheme(t){ if(t) document.documentElement.dataset.theme=t; const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; tbtn.textContent = dark ? 'Paper' : 'Chalkboard'; }
let saved=null; try{ saved=localStorage.getItem('lemma-theme'); }catch(e){}
applyTheme(saved);
tbtn.addEventListener('click',()=>{ const dark = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()==='#1f2a26'; const t = dark?'light':'dark'; applyTheme(t); try{localStorage.setItem('lemma-theme',t);}catch(e){} });

render();
</script>
</body>
</html>
